# .github/workflows/release.yml
name: Release Modpack

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Check version change
        id: version
        run: |
          OLD=$(git show HEAD~1:pack.toml | grep '^version' | cut -d'"' -f2)
          NEW=$(grep '^version' pack.toml | cut -d'"' -f2)
          echo "old=$OLD" >> $GITHUB_OUTPUT
          echo "new=$NEW" >> $GITHUB_OUTPUT
          if [ "$OLD" != "$NEW" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Export modpack
        if: steps.version.outputs.changed == 'true'
        run: packwiz modrinth export

      - name: Create release
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new }}
          name: Berettitiland v${{ steps.version.outputs.new }}
          files: "*.mrpack"
