name: Release Modpack

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Get current version
        id: version
        run: |
          VERSION=$(grep '^version' pack.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get latest release version
        id: latest
        run: |
          LATEST=$(gh release view latest --json tagName -q '.tagName' 2>/dev/null || echo "none")
          echo "version=$LATEST" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check version changed
        id: changed
        run: |
          if [ "v${{ steps.version.outputs.version }}" != "${{ steps.latest.outputs.version }}" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract changelog
        if: steps.changed.outputs.changed == 'true'
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.version }}
          CHANGELOG=$(awk "/^## $VERSION$/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md)
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Export modpack
        if: steps.changed.outputs.changed == 'true'
        run: packwiz modrinth export

      - name: Create versioned release
        if: steps.changed.outputs.changed == 'true'
        id: versioned_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Berettitiland v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.content }}
          files: "*.mrpack"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest
        if: steps.changed.outputs.changed == 'true' && steps.versioned_release.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          body: ${{ steps.changelog.outputs.content }}
          files: "*.mrpack"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
